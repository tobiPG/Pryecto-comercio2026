<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CFA0" />
      <stop offset="50%" stop-color="#D8B676" />
      <stop offset="100%" stop-color="#B8925A" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  <g transform="translate(400,380)" opacity="0.9">
    <!-- Gema facetada estilizada -->
    <polygon points="0,-140 90,-60 60,90 -60,90 -90,-60" fill="none" stroke="url(#gold)" stroke-width="2.5" />
    <polygon points="0,-140 90,-60 -90,-60" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7" />
    <polygon points="90,-60 60,90 0,-10" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7" />
    <polygon points="-90,-60 -60,90 0,-10" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7" />
    <polygon points="60,90 -60,90 0,-10" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7" />
    <line x1="0" y1="-140" x2="0" y2="-10" stroke="url(#gold)" stroke-width="1" opacity="0.5" />
  </g>
  <text x="400" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="28" letter-spacing="6" fill="#D8B676" opacity="0.85">LUEUR</text>
  <text x="400" y="632" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#A3A0A0">JEWELRY</text>
